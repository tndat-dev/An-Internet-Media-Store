services:
  postgres:
    image: postgres:16-alpine
    container_name: aims-postgres
    environment:
      POSTGRES_DB: aims
      POSTGRES_USER: aims
      POSTGRES_PASSWORD: aims
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aims -d aims"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
