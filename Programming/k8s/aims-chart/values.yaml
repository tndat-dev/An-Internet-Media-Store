backendImage:
  repository: ghcr.io/tndat-dev/aims-backend
  tag: sha256:54ad50a19e7aa23f65c241d9681ec1497158c238efc85d9e5dfa9cc45d8d1f24
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull

# Immutable source revision used to force a controlled rollout when a node-local
# lab image is rebuilt under the stable prod-sim tag. Registry deployments use
# an image digest and update this value to the commit that produced that digest.
sourceRevision: "6f7b23ca8731a3110a4d4a21d9bb0e13648d6d5c"

frontend:
  replicas: 2
  # Lab-only placement for the node-local prod-sim image. Set to {} after CI
  # publishes the signed registry digest to all workers.
  nodeSelector: {}
  image:
    repository: ghcr.io/tndat-dev/aims-frontend
    tag: sha256:56d0809e62369de5a6c828d23b10e7dcc1aa9328f96a1b2fda9025752144f372
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 512Mi

runtimeSecret: aims-runtime

services:
- name: api-gateway
  replicas: 2
  image: {}
- name: auth-service
  replicas: 2
  image: {}
- name: catalog-service
  replicas: 2
  image: {}
- name: cart-service
  replicas: 2
  image: {}
- name: order-service
  replicas: 2
  image: {}
- name: payment-service
  replicas: 2
  sandbox: true
  image: {}
- name: inventory-service
  replicas: 2
    # The workflow replaces this compatibility image with the independently
    # built GHCR digest only after scan/sign/attestation succeeds.
  image:
    repository: ghcr.io/tndat-dev/aims-inventory-service
    tag: sha256:303784156a076c55ada03b6a06ed9d5bbb55691b04d3c4f087fd52851fdae8e8
    pullPolicy: IfNotPresent
  kafkaTlsSecret: aims-services
  kafkaClusterCaSecret: aims-kafka-cluster-ca-cert
  kafkaBootstrap: aims-kafka-kafka-bootstrap.production.svc.cluster.local:9093
  kafkaConsumerTopic: aims.business.order.created.v1
  extraEnv:
    KAFKA_CONSUMER_GROUP: aims.inventory-service.v1
    KAFKA_OUTPUT_TOPIC_SUCCESS: aims.business.inventory.reserved.v1
    KAFKA_OUTPUT_TOPIC_FAILURE: aims.business.inventory.rejected.v1
  sourceRevision: 6f7b23ca8731a3110a4d4a21d9bb0e13648d6d5c
- name: notification-service
  replicas: 2
  sandbox: true
  image:
    repository: ghcr.io/tndat-dev/aims-notification-service
    tag: sha256:2f4bb193c593ef43ac3d692c148b905bf678a244d06122ad57140217bdfcac82
    pullPolicy: IfNotPresent
  sourceRevision: "6f7b23ca8731a3110a4d4a21d9bb0e13648d6d5c"
  kafkaTlsSecret: aims-services
  kafkaClusterCaSecret: aims-kafka-cluster-ca-cert
  kafkaBootstrap: aims-kafka-kafka-bootstrap.production.svc.cluster.local:9093
  kafkaConsumerTopic: aims.business.payment.completed.v1
- name: security-telemetry-service
  replicas: 2
  localhostProfiles: true
  image: {}

integrations:
  kafkaBootstrap: aims-kafka-kafka-bootstrap.production.svc.cluster.local:9092
  kafkaBusinessTopic: aims-business-events
  kafkaSecurityTopic: aims-security-telemetry
  redisHost: aims-redis-sentinel.production.svc.cluster.local
  redisPort: "26379"
  rabbitmqHost: aims-rabbitmq.production.svc.cluster.local
  rabbitmqPort: "5672"
  keycloakIssuer: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/aims
  otlpEndpoint: http://otel-collector-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 768Mi
