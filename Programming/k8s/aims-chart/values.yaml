backendImage:
  repository: ghcr.io/tndat-dev/aims-backend
  tag: sha256:0582fca4f360770a9cbdb589e19cb6ecf6e753f6145150dd4f8b189d07f184c0
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull

# Rollout is used by the full platform profile. Set this to Deployment on OKE
# when Argo Rollouts and the Prometheus analysis stack are not installed yet.
workloadKind: Rollout
analysis:
  enabled: true
routing:
  enabled: true
disableLocalhostProfiles: false
appArmorEnabled: true

# Immutable source revision used to force a controlled rollout when a node-local
# lab image is rebuilt under the stable prod-sim tag. Registry deployments use
# an image digest and update this value to the commit that produced that digest.
sourceRevision: "7a706d8f7790e2dcac84ab88939331ddfcd9b6e9"

frontend:
  replicas: 2
  # Lab-only placement for the node-local prod-sim image. Set to {} after CI
  # publishes the signed registry digest to all workers.
  nodeSelector: {}
  image:
    repository: ghcr.io/tndat-dev/aims-frontend
    tag: sha256:d0adc1a60b59d0304140fd164a363b985b23b4b746a7f2656f1a2d16b87d9183
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 512Mi

runtimeSecret: aims-runtime
globalExtraEnv: {}

services:
- name: api-gateway
  replicas: 2
  image:
