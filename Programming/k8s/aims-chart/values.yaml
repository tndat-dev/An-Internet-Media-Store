  sourceRevision: 5a04c5256cd2c7d6c5de69de29c6a23e4d5d3a1c
integrations:
  kafkaBootstrap: aims-kafka-kafka-bootstrap.production.svc.cluster.local:9092
  # When set, this takes precedence over service-specific bootstrap addresses.
  kafkaBootstrapOverride: ""
  kafkaBusinessTopic: aims-business-events
  kafkaSecurityTopic: aims-security-telemetry
  redisHost: aims-redis-sentinel-sentinel.production.svc.cluster.local
  redisPort: "26379"
  rabbitmqHost: aims-rabbitmq.production.svc.cluster.local
  rabbitmqPort: "5672"
  keycloakIssuer: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/aims
  otlpEndpoint: http://otel-collector-collector.observability.svc.cluster.local:4317

resources:
  requests:
    # A Python/OTel process idles around 120-160m on this lab. A realistic
    # request prevents the HPA from pinning every service at maxReplicas while
    # still leaving headroom for burst-driven scaling.
    cpu: 200m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
