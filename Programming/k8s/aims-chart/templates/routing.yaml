# North-south entry point. GatewayClass "istio" means Istio owns the managed
# ingress Deployment and Service. This is separate from the "istio-waypoint"
# GatewayClass used for Ambient east-west L7 processing.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: aims-lab-selfsigned
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: aims
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aims-ingress-tls
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: aims
spec:
  secretName: aims-ingress-tls
  issuerRef:
    name: aims-lab-selfsigned
    kind: Issuer
  dnsNames:
    - aims.lab
  duration: 2160h
  renewBefore: 360h
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aims-ingress
  namespace: istio-ingress
  annotations:
    # Bare-metal kubeadm cluster has no cloud LoadBalancer controller. Expose
    # the Istio-managed gateway through a stable NodePort on every node.
    networking.istio.io/service-type: NodePort
  labels:
    app.kubernetes.io/name: aims-ingress
    app.kubernetes.io/part-of: aims
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: production
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: aims-ingress-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: production
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aims-ingress
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: aims
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aims-ingress-istio
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aims-ingress
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: aims
spec:
  minAvailable: 1
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: aims-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aims-web
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aims-ingress
      namespace: istio-ingress
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aims-ingress
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/auth/}
        - path: {type: PathPrefix, value: /api/admin/}
      backendRefs:
        - {group: "", kind: Service, name: auth-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/products/}
      backendRefs:
        - {group: "", kind: Service, name: catalog-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/cart/}
      backendRefs:
        - {group: "", kind: Service, name: cart-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/orders/}
      backendRefs:
        - {group: "", kind: Service, name: order-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/payments/}
      backendRefs:
        - {group: "", kind: Service, name: payment-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/inventory/}
      backendRefs:
        - {group: "", kind: Service, name: inventory-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/notifications/}
      backendRefs:
        - {group: "", kind: Service, name: notification-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/security/}
      backendRefs:
        - {group: "", kind: Service, name: security-telemetry-service, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /api/}
      backendRefs:
        - {group: "", kind: Service, name: api-gateway, port: 8000, weight: 1}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: aims-frontend, port: 3000, weight: 1}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aims-microservices
  namespace: production
spec:
  maxUnavailable: 25%
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aims
      app.kubernetes.io/component: backend
