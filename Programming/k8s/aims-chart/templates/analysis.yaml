apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: aims-service-slo
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  args:
    - name: service-name
  metrics:
    - name: http-5xx-ratio
      interval: 30s
      count: 3
      failureLimit: 2
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(http_server_duration_milliseconds_count{job="production/{{ `{{args.service-name}}` }}",http_status_code=~"5.."}[2m]))
              /
              clamp_min(sum(rate(http_server_duration_milliseconds_count{job="production/{{ `{{args.service-name}}` }}"}[2m])), 0.001)
            ) or vector(0)
    - name: http-p95-milliseconds
      interval: 30s
      count: 3
      failureLimit: 2
      successCondition: result[0] <= 1500
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_duration_milliseconds_bucket{job="production/{{ `{{args.service-name}}` }}"}[2m])
              )
            ) or vector(0)
