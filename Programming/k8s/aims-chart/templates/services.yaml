{{- range .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: production
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: aims
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: production
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: aims
    istio.io/use-waypoint: aims-waypoint
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .name }}
  namespace: production
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: aims
spec:
  replicas: {{ .replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: aims
        app.kubernetes.io/component: backend
        aims.hust.vn/workload-group: microservices
        aims.hust.vn/runtime-hardened: "true"
    spec:
      serviceAccountName: {{ .name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- if .sandbox }}
      runtimeClassName: sandbox
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          {{- if .localhostProfiles }}
          type: Localhost
          localhostProfile: profiles/aims-runtime.json
          {{- else }}
          type: RuntimeDefault
          {{- end }}
        appArmorProfile:
          {{- if .localhostProfiles }}
          type: Localhost
          localhostProfile: aims-restricted
          {{- else }}
          type: RuntimeDefault
          {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Canary maxSurge temporarily adds a third pod for a service. Keep
          # this a strong scheduler preference so concurrent Rollouts cannot
          # deadlock while old replicas are still counted.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              aims.hust.vn/workload-group: microservices
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          {{ if hasPrefix "sha256:" $.Values.backendImage.tag }}
          image: {{ $.Values.backendImage.repository }}@{{ $.Values.backendImage.tag }}
          {{ else }}
          image: {{ $.Values.backendImage.repository }}:{{ $.Values.backendImage.tag }}
          {{ end }}
          imagePullPolicy: {{ $.Values.backendImage.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ $.Values.runtimeSecret }}
          env:
            - name: AIMS_SERVICE_NAME
              value: {{ .name | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.integrations.kafkaBootstrap | quote }}
            - name: KAFKA_BUSINESS_TOPIC
              value: {{ $.Values.integrations.kafkaBusinessTopic | quote }}
            - name: KAFKA_SECURITY_TOPIC
              value: {{ $.Values.integrations.kafkaSecurityTopic | quote }}
            - name: REDIS_HOST
              value: {{ $.Values.integrations.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ $.Values.integrations.redisPort | quote }}
            - name: RABBITMQ_HOST
              value: {{ $.Values.integrations.rabbitmqHost | quote }}
            - name: RABBITMQ_PORT
              value: {{ $.Values.integrations.rabbitmqPort | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ $.Values.integrations.keycloakIssuer | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.integrations.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .name | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            # Kubelet probes are plaintext host traffic. With Ambient STRICT,
            # use an in-container loopback probe so health checks do not need
            # an mTLS exception on the application port.
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml $.Values.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
