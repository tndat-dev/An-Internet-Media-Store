apiVersion: v1
kind: Namespace
metadata:
  name: cks-lab
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cks-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cks-student
  namespace: cks-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cks-observer
  namespace: cks-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cks-student-observer
  namespace: cks-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cks-observer
subjects:
  - kind: ServiceAccount
    name: cks-student
    namespace: cks-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cks-lab-quota
  namespace: cks-lab
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cks-lab-defaults
  namespace: cks-lab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cks-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-for-labeled-pods
  namespace: cks-lab
spec:
  podSelector:
    matchLabels:
      cks.aims.io/allow-dns: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvisor-runtime-smoke
  namespace: cks-lab
  labels:
    app.kubernetes.io/name: gvisor-runtime-smoke
    app.kubernetes.io/part-of: aims-cks-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gvisor-runtime-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gvisor-runtime-smoke
        app.kubernetes.io/part-of: aims-cks-lab
    spec:
      runtimeClassName: sandbox
      automountServiceAccountToken: false
      nodeSelector:
        runtime.gvisor.dev/enabled: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
