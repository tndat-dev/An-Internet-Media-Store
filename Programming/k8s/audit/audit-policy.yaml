apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
omitManagedFields: true
rules:
  # Never record request/response bodies containing Secret material.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]
  # Authentication, authorization and admission changes need strong evidence.
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      - group: "admissionregistration.k8s.io"
        resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
      - group: "kyverno.io"
        resources: ["policies", "clusterpolicies", "policyexceptions"]
      - group: "templates.gatekeeper.sh"
        resources: ["constrainttemplates"]
  # Record mutating operations for production and cluster-scoped infrastructure.
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    namespaces: ["production"]
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: ""
        resources: ["namespaces", "nodes", "serviceaccounts", "persistentvolumes"]
      - group: "apps"
        resources: ["deployments", "daemonsets", "statefulsets"]
      - group: "batch"
        resources: ["jobs", "cronjobs"]
      - group: "gateway.networking.k8s.io"
        resources: ["gateways", "httproutes", "gatewayclasses", "referencegrants"]
  # Authentication and authorization failures are useful security signals.
  - level: Metadata
    omitStages: ["RequestReceived"]
    resources:
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]
      - group: "authorization.k8s.io"
        resources: ["subjectaccessreviews", "selfsubjectaccessreviews", "selfsubjectrulesreviews"]
  # Avoid high-volume probes, watches and event traffic.
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/metrics"]
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  - level: None
    resources:
      - group: ""
        resources: ["events"]
  # Metadata catch-all supplies actor, verb, object and result without bodies.
  - level: Metadata
