apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aims-postgres-cnpg
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: aims
      owner: aims
  storage:
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    enablePodMonitor: false
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: aims-redis
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  clusterSize: 3
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.2.1
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: aims-redis-auth
      key: password
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  storage:
    keepAfterDelete: true
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: aims-redis-sentinel
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  clusterSize: 3
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.2.1
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: aims-redis-auth
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
  redisSentinelConfig:
    redisReplicationName: aims-redis
    redisReplicationPassword:
      secretKeyRef:
        name: aims-redis-auth
        key: password
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: aims-minio
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  imagePullPolicy: IfNotPresent
  requestAutoCert: false
  configuration:
    name: aims-minio-env
  pools:
    - name: pool-0
      servers: 2
      volumesPerServer: 2
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  v1.min.io/tenant: aims-minio
              topologyKey: kubernetes.io/hostname
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              storage: 10Gi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 1000
  prometheusOperator: true
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: production
  labels:
    strimzi.io/cluster: aims-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  template:
    pod:
      metadata:
        labels:
          app.kubernetes.io/part-of: aims
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/name: aims-kafka-kafka
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # Strimzi runs Kafka as UID 1001/GID 0. Longhorn volumes can be
        # reattached with a 0755 root after node movement; kubelet must restore
        # group-write permission before the non-root broker starts.
        fsGroup: 0
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
    kafkaContainer:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
  storage:
    type: persistent-claim
    size: 10Gi
    class: longhorn
    deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: aims-kafka
  namespace: production
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
  labels:
    app.kubernetes.io/part-of: aims
spec:
  kafka:
    authorization:
      type: simple
    template:
      pod:
        securityContext:
          runAsNonRoot: true
          fsGroup: 0
          fsGroupChangePolicy: Always
          seccompProfile:
            type: RuntimeDefault
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
    template:
      pod:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      topicOperatorContainer:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
      userOperatorContainer:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: aims-business-events
  namespace: production
  labels:
    strimzi.io/cluster: aims-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 604800000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: aims-security-telemetry
  namespace: production
  labels:
    strimzi.io/cluster: aims-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 1209600000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: aims-services
  namespace: production
  labels:
    strimzi.io/cluster: aims-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: aims-
          patternType: prefix
        operations:
          - Read
          - Write
          - Describe
      - resource:
          type: group
          name: aims-
          patternType: prefix
        operations:
          - Read
          - Describe
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: aims-rabbitmq
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  replicas: 3
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: aims-rabbitmq
          topologyKey: kubernetes.io/hostname
  persistence:
    storageClassName: longhorn
    storage: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  rabbitmq:
    additionalConfig: |
      cluster_partition_handling = pause_minority
      queue_master_locator = min-masters
      vm_memory_high_watermark.relative = 0.7
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: payment-tasks
  namespace: production
spec:
  name: payment.tasks
  durable: true
  rabbitmqClusterReference:
    name: aims-rabbitmq
  arguments:
    x-dead-letter-exchange: aims.dlx
    x-dead-letter-routing-key: payment.failed
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: notification-tasks
  namespace: production
spec:
  name: notification.tasks
  durable: true
  rabbitmqClusterReference:
    name: aims-rabbitmq
  arguments:
    x-dead-letter-exchange: aims.dlx
    x-dead-letter-routing-key: notification.failed
