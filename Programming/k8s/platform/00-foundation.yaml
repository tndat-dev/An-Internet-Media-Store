apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sandbox
handler: runsc
scheduling:
  nodeSelector:
    runtime.gvisor.dev/enabled: "true"
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ambient-hostprobes
spec:
  description: Allow Istio Ambient SNAT-ed kubelet health probes
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector: {}
  ingress:
    - fromCIDR:
        - 169.254.7.127/32
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: production-strict
  namespace: production
spec:
  mtls:
    mode: STRICT
---
# Strimzi authenticates this listener with client TLS. Ambient STRICT would
# otherwise expect HBONE on the application port and terminate the native Kafka
# TLS handshake. PERMISSIVE is intentionally limited to 9093; Kafka ACL + mTLS
# remain mandatory on that listener.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: kafka-native-tls
  namespace: production
  labels:
    app.kubernetes.io/part-of: aims
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: aims-kafka
      strimzi.io/kind: Kafka
      strimzi.io/name: aims-kafka-kafka
  portLevelMtls:
    "9093":
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: cnpg-management-native-tls
  namespace: production
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: aims-postgres-cnpg
  # CloudNativePG already protects port 8000 with its own mutual TLS. Ambient
  # does not support DISABLE; PERMISSIVE lets its native HTTPS pass while all
  # PostgreSQL application ports remain STRICT.
  portLevelMtls:
    "8000":
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: rabbitmq-startup-probe
  namespace: production
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aims-rabbitmq
  # The operator-generated startup probe is plaintext HTTP from kubelet. AMQP,
  # Erlang distribution and every other workload port remain STRICT.
  portLevelMtls:
    "15672":
      mode: PERMISSIVE
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ambient-hbone
  namespace: production
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: aims-kafka-kafka
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 15008
          protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aims-waypoint
  namespace: production
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-guardrails
  namespace: production
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    # Includes temporary maxSurge pods while all nine Rollouts canary together.
    limits.cpu: "50"
    limits.memory: 64Gi
    persistentvolumeclaims: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: production-defaults
  namespace: production
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
