apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc.cluster.local:8200
      path: aims
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aims-runtime
  namespace: production
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aims-runtime
    creationPolicy: Merge
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: production
        property: DJANGO_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: production
        property: DATABASE_URL
    - secretKey: DJANGO_ALLOWED_HOSTS
      remoteRef:
        key: production
        property: DJANGO_ALLOWED_HOSTS
    - secretKey: CORS_ALLOWED_ORIGINS
      remoteRef:
        key: production
        property: CORS_ALLOWED_ORIGINS
    - secretKey: DJANGO_DEBUG
      remoteRef:
        key: production
        property: DJANGO_DEBUG
    - secretKey: PAYPAL_SANDBOX
      remoteRef:
        key: production
        property: PAYPAL_SANDBOX
    - secretKey: PAYPAL_CLIENT_ID
      remoteRef:
        key: production
        property: PAYPAL_CLIENT_ID
    - secretKey: PAYPAL_CLIENT_SECRET
      remoteRef:
        key: production
        property: PAYPAL_CLIENT_SECRET
    - secretKey: PAYPAL_CURRENCY
      remoteRef:
        key: production
        property: PAYPAL_CURRENCY
    - secretKey: PAYPAL_VND_PER_USD
      remoteRef:
        key: production
        property: PAYPAL_VND_PER_USD
    - secretKey: VIETQR_ENV
      remoteRef:
        key: production
        property: VIETQR_ENV
    - secretKey: VIETQR_BASE_URL
      remoteRef:
        key: production
        property: VIETQR_BASE_URL
    - secretKey: VIETQR_USERNAME
      remoteRef:
        key: production
        property: VIETQR_USERNAME
    - secretKey: VIETQR_PASSWORD
      remoteRef:
        key: production
        property: VIETQR_PASSWORD
    - secretKey: VIETQR_BANK_CODE
      remoteRef:
        key: production
        property: VIETQR_BANK_CODE
    - secretKey: VIETQR_BANK_ACCOUNT
      remoteRef:
        key: production
        property: VIETQR_BANK_ACCOUNT
    - secretKey: VIETQR_USER_BANK_NAME
      remoteRef:
        key: production
        property: VIETQR_USER_BANK_NAME
    - secretKey: VIETQR_CALLBACK_USERNAME
      remoteRef:
        key: production
        property: VIETQR_CALLBACK_USERNAME
    - secretKey: VIETQR_CALLBACK_PASSWORD
      remoteRef:
        key: production
        property: VIETQR_CALLBACK_PASSWORD
    - secretKey: VIETQR_CALLBACK_TOKEN_TTL_SECONDS
      remoteRef:
        key: production
        property: VIETQR_CALLBACK_TOKEN_TTL_SECONDS
    - secretKey: VIETQR_REQUEST_TIMEOUT
      remoteRef:
        key: production
        property: VIETQR_REQUEST_TIMEOUT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production
        property: REDIS_PASSWORD
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: production
        property: RABBITMQ_USERNAME
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: production
        property: RABBITMQ_PASSWORD
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: production
        property: KEYCLOAK_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aims-rabbitmq-app-credentials
  namespace: production
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aims-rabbitmq-app-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          rabbitmq.com/topology-operator: "true"
  data:
    - secretKey: username
      remoteRef:
        key: production
        property: RABBITMQ_USERNAME
    - secretKey: password
      remoteRef:
        key: production
        property: RABBITMQ_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aims-redis-auth
  namespace: production
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aims-redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: production
        property: REDIS_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aims-minio-env
  namespace: production
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aims-minio-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.env: |
          export MINIO_ROOT_USER="{{ .rootUser }}"
          export MINIO_ROOT_PASSWORD="{{ .rootPassword }}"
  data:
    - secretKey: rootUser
      remoteRef:
        key: production
        property: MINIO_ROOT_USER
    - secretKey: rootPassword
      remoteRef:
        key: production
        property: MINIO_ROOT_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aims-opensearch-admin
  namespace: opensearch
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aims-opensearch-admin
    creationPolicy: Owner
  data:
    - secretKey: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      remoteRef:
        key: production
        property: OPENSEARCH_INITIAL_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-credentials
  namespace: velero
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloud-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .rootUser }}
          aws_secret_access_key={{ .rootPassword }}
  data:
    - secretKey: rootUser
      remoteRef:
        key: production
        property: MINIO_ROOT_USER
    - secretKey: rootPassword
      remoteRef:
        key: production
        property: MINIO_ROOT_PASSWORD
