tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  metricsGenerator:
    enabled: true
  retention: 168h
podLabels:
  aims.hust.vn/placement-group: telemetry-storage
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              aims.hust.vn/placement-group: telemetry-storage
          topologyKey: kubernetes.io/hostname
persistence:
  enabled: true
  storageClassName: longhorn
  size: 10Gi
serviceMonitor:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
