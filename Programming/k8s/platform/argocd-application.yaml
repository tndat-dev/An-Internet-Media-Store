apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aims-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # GitHub Actions promotes verified GHCR digests here; Argo CD remains the
    # only actor applying this desired state to production.
    repoURL: https://github.com/tndat-dev/An-Internet-Media-Store.git
    targetRevision: main
    path: Programming/k8s/aims-chart
    helm:
      releaseName: aims
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10
