apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-velero-bucket
  namespace: production
  labels:
    app.kubernetes.io/name: minio-create-velero-bucket
    app.kubernetes.io/part-of: aims
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-velero-bucket
        app.kubernetes.io/part-of: aims
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              . /config/config.env
              mc alias set aims http://minio.production.svc.cluster.local \
                "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
              mc mb --ignore-existing aims/velero
              mc anonymous set none aims/velero
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: minio-env
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: minio-env
          secret:
            secretName: aims-minio-env
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
