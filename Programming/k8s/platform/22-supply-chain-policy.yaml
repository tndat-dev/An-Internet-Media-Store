apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aims-verify-signed-slsa-images
  annotations:
    policies.kyverno.io/title: Verify AIMS Cosign signatures, SLSA provenance and SBOM
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  # Enforcement applies to GHCR images promoted by the AIMS GitHub workflow.
  # Existing node-local lab images do not match imageReferences; once the first
  # signed release is promoted, every matching GHCR image must verify.
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-gitlab-keyless-image-and-attestations
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
      verifyImages:
        - imageReferences:
            - "ghcr.io/tndat-dev/aims-*"
          required: true
          # GitOps already supplies immutable digests, so admission verifies
          # without rewriting the Pod image reference.
          mutateDigest: false
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/tndat-dev/An-Internet-Media-Store/.github/workflows/aims-supply-chain.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/tndat-dev/An-Internet-Media-Store/.github/workflows/aims-supply-chain.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: https://github.com/aims/buildtypes/container/v1
                    - key: "{{ runDetails.builder.id }}"
                      operator: Equals
                      value: "https://github.com/tndat-dev/An-Internet-Media-Store/.github/workflows/aims-supply-chain.yml@refs/heads/main"
            - type: https://cyclonedx.org/bom
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/tndat-dev/An-Internet-Media-Store/.github/workflows/aims-supply-chain.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ Data.bomFormat }}"
                      operator: Equals
                      value: CycloneDX
