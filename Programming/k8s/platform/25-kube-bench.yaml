apiVersion: v1
kind: Namespace
metadata:
  name: security-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-bench-control-plane
  namespace: security-system
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/component: control-plane-benchmark
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-bench
      app.kubernetes.io/component: control-plane-benchmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
        app.kubernetes.io/component: control-plane-benchmark
    spec:
      automountServiceAccountToken: false
      hostPID: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.15.5
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              while true; do
                date -u +%FT%TZ
                kube-bench run --version 1.34 \
                  --targets master,etcd,node,policies --json || true
                sleep 604800
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: etc, mountPath: /etc, readOnly: true}
            - {name: var, mountPath: /var, readOnly: true}
            - {name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true}
            - {name: systemd-units, mountPath: /usr/lib/systemd/system, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: etc
          hostPath: {path: /etc, type: Directory}
        - name: var
          hostPath: {path: /var, type: Directory}
        - name: usr-bin
          hostPath: {path: /usr/bin, type: Directory}
        - name: systemd-units
          hostPath: {path: /usr/lib/systemd/system, type: Directory}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-bench-worker
  namespace: security-system
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/component: worker-benchmark
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-bench
      app.kubernetes.io/component: worker-benchmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
        app.kubernetes.io/component: worker-benchmark
    spec:
      automountServiceAccountToken: false
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.15.5
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              while true; do
                date -u +%FT%TZ
                kube-bench run --version 1.34 \
                  --targets node,policies --json || true
                sleep 604800
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: etc, mountPath: /etc, readOnly: true}
            - {name: var, mountPath: /var, readOnly: true}
            - {name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true}
            - {name: systemd-units, mountPath: /usr/lib/systemd/system, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: etc
          hostPath: {path: /etc, type: Directory}
        - name: var
          hostPath: {path: /var, type: Directory}
        - name: usr-bin
          hostPath: {path: /usr/bin, type: Directory}
        - name: systemd-units
          hostPath: {path: /usr/lib/systemd/system, type: Directory}
        - name: tmp
          emptyDir: {}
