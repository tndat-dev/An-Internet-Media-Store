apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  image: otel/opentelemetry-collector-contrib:0.156.0
  mode: deployment
  replicas: 2
  managementState: managed
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
      batch: {}
      resource:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert
    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - resource
            - batch
          exporters:
            - otlp/tempo
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - resource
            - batch
          exporters:
            - prometheus
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - resource
            - batch
          exporters:
            - otlphttp/loki
            - debug
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-collector
  endpoints:
    - port: prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aims-microservices
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: aims
spec:
  namespaceSelector:
    matchNames:
      - production
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aims
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aims-service-slos
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: aims
spec:
  groups:
    - name: aims.availability
      rules:
        - alert: AIMSServiceTargetDown
          expr: up{namespace="production",service=~"api-gateway|auth-service|catalog-service|cart-service|order-service|payment-service|inventory-service|notification-service|search-recommendation-service|security-telemetry-service"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "AIMS metrics target {{ $labels.service }} is down"
        - alert: AIMSHighHTTP5xxRatio
          expr: |
            sum by (service) (rate(http_requests_total{namespace="production",status=~"5.."}[5m]))
            /
            clamp_min(sum by (service) (rate(http_requests_total{namespace="production"}[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "AIMS service {{ $labels.service }} exceeds the 5% HTTP 5xx SLO"
