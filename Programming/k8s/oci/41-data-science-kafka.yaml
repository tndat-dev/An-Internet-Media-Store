apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: data-science
  namespace: kafka
  labels:
    strimzi.io/cluster: aims-kafka
    app.kubernetes.io/part-of: data-science
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: ds.
          patternType: prefix
        operations:
          - Read
          - Write
          - Describe
          - Create
      - resource:
          type: group
          name: ds.
          patternType: prefix
        operations:
          - Read
          - Describe
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: ds.feature.events.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: aims-kafka
    app.kubernetes.io/part-of: data-science
spec:
  topicName: ds.feature.events.v1
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: delete
    retention.ms: 604800000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: ds.training.jobs.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: aims-kafka
    app.kubernetes.io/part-of: data-science
spec:
  topicName: ds.training.jobs.v1
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: delete
    retention.ms: 604800000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: ds.predictions.v1
