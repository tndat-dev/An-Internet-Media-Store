apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aims-web
  namespace: aims
  labels:
    app.kubernetes.io/part-of: aims
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aims-frontend
                port:
                  number: 3000
